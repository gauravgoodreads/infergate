name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q

      - name: Semantic threshold calibration
        run: python -m bench.calibrate

      - name: Benchmark smoke run
        run: python -m bench.run_all --requests 300 --concurrency 25 --herd 20 --repeat 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-py${{ matrix.python-version }}
          path: bench/results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t infergate:ci .
      - name: Validate compose file
        run: docker compose config -q

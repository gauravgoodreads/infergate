worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    # Docker's embedded DNS resolves `gateway` to every replica's IP, so this
    # upstream load-balances across all three without extra configuration.
    upstream infergate {
        least_conn;
        server gateway:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Generous read timeout: an uncached completion legitimately takes seconds.
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;

        location /health {
            proxy_pass http://infergate;
        }

        location / {
            proxy_pass http://infergate;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
